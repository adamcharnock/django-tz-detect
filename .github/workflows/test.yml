name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.15', '3.14', '3.13', '3.12', '3.11']
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install tox
        run: |
          uv tool install --python ${{ matrix.python-version }} tox --with tox-uv --with tox-gh
      - name: Run tests
        run: tox

  coverage:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - name: Run tests with coverage
        run: uv run --group dev coverage run -m pytest
      - name: Coverage comment
        uses: py-cov-action/python-coverage-comment-action@v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
